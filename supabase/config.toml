# Supabase CLI configuration for local development and CI.
# Only the settings ShootFlow relies on are listed; everything else uses CLI defaults.
project_id = "shootflow"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
# Files live in Cloudflare R2, not Supabase Storage.
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
# Wildcard so /auth/callback?next=... matches.
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.rate_limit]
# Generous limits for local development and end-to-end tests.
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only: production keeps email confirmation on.
enable_confirmations = false
max_frequency = "1s"

[inbucket]
# Local mail catcher (Mailpit); e2e tests read magic links from it.
enabled = true
port = 54324

[edge_runtime]
enabled = false

[analytics]
enabled = false
