name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed only to commit a freshly generated pnpm-lock.yaml back to main.
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            scripts/ci-run.sh "Install" pnpm install --frozen-lockfile
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pnpm-lock.yaml is missing; resolving dependencies fresh."
            scripts/ci-run.sh "Install" pnpm install --no-frozen-lockfile
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated lockfile
        if: steps.install.outputs.generated == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: add generated pnpm-lock.yaml"
          git pull --rebase origin main
          git push

      - name: Lint
        run: scripts/ci-run.sh "Lint" pnpm lint

      - name: Typecheck
        run: scripts/ci-run.sh "Typecheck" pnpm typecheck

      - name: Translation keys
        run: scripts/ci-run.sh "Translation keys" pnpm i18n:check

      - name: Unit tests
        run: scripts/ci-run.sh "Unit tests" pnpm test

      - name: Build
        run: scripts/ci-run.sh "Build" pnpm build

      - name: Install Playwright browser
        run: scripts/ci-run.sh "Playwright install" pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: scripts/ci-run.sh "E2E" pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  database:
    name: Database migrations, RLS and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed only to commit regenerated database types back to main.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations and seed)
        run: scripts/ci-run.sh "Supabase start" supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor

      - name: Lint database functions
        run: scripts/ci-run.sh "Database lint" supabase db lint --level warning --fail-on error

      - name: pgTAP tests
        run: scripts/ci-run.sh "pgTAP" supabase test db

      - name: Generate TypeScript types
        run: |
          mkdir -p src/lib/supabase
          scripts/ci-run.sh "Generate types" bash -c 'supabase gen types typescript --local > src/lib/supabase/database.types.ts'

      - name: Commit regenerated types
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain src/lib/supabase/database.types.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/supabase/database.types.ts
            git commit -m "chore: regenerate Supabase database types"
            git pull --rebase origin main
            git push
          else
            echo "Database types are up to date."
          fi

      - name: Check types are committed
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain src/lib/supabase/database.types.ts)" ]; then
            echo "::error title=Database types::src/lib/supabase/database.types.ts is out of date. Regenerate with: supabase gen types typescript --local"
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
