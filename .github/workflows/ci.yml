name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed only to commit a freshly generated pnpm-lock.yaml back to main.
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: |
          if scripts/ci-run.sh "Install" pnpm install --frozen-lockfile; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # package.json changed without a lockfile update (deps are added from an
            # environment without npm access): resolve here and commit the lockfile.
            echo "::warning::pnpm-lock.yaml is out of date; resolving dependencies fresh."
            scripts/ci-run.sh "Install" pnpm install --no-frozen-lockfile
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Commit updated lockfile
        if: steps.install.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm-lock.yaml"
          git pull --rebase origin main
          git push

      - name: Lint
        run: scripts/ci-run.sh "Lint" pnpm lint

      - name: Typecheck
        run: scripts/ci-run.sh "Typecheck" pnpm typecheck

      - name: Translation keys
        run: scripts/ci-run.sh "Translation keys" pnpm i18n:check

      - name: Unit tests
        run: scripts/ci-run.sh "Unit tests" pnpm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase for the app
        run: |
          scripts/ci-run.sh "Supabase start" supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,realtime
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
          } >> "$GITHUB_ENV"

      - name: Build
        run: scripts/ci-run.sh "Build" pnpm build

      - name: Install Playwright browser
        run: scripts/ci-run.sh "Playwright install" pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: scripts/ci-run.sh "E2E" pnpm test:e2e

      - name: End-to-end summary
        if: always()
        run: |
          if [ -f test-results/results.json ]; then
            node -e '
              const r = require("./test-results/results.json");
              const s = r.stats;
              const files = [...new Set(r.suites.map((x) => x.file))].join(", ");
              console.log(`::notice title=E2E summary::${s.expected} passed, ${s.unexpected} failed, ${s.flaky} flaky, ${s.skipped} skipped in ${files}`);
            '
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  database:
    name: Database migrations, RLS and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed only to commit regenerated database types back to main.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations and seed)
        run: scripts/ci-run.sh "Supabase start" supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor

      - name: Lint database functions
        run: scripts/ci-run.sh "Database lint" supabase db lint --level warning --fail-on error

      - name: pgTAP tests
        run: scripts/ci-run.sh "pgTAP" supabase test db

      - name: Generate TypeScript types
        run: |
          mkdir -p src/lib/supabase
          scripts/ci-run.sh "Generate types" bash -c 'supabase gen types typescript --local > src/lib/supabase/database.types.ts'

      - name: Commit regenerated types
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain src/lib/supabase/database.types.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/supabase/database.types.ts
            git commit -m "chore: regenerate Supabase database types"
            git pull --rebase origin main
            git push
          else
            echo "Database types are up to date."
          fi

      - name: Check types are committed
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain src/lib/supabase/database.types.ts)" ]; then
            echo "::error title=Database types::src/lib/supabase/database.types.ts is out of date. Regenerate with: supabase gen types typescript --local"
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  deploy-database:
    name: Apply migrations to the cloud database
    needs: [check, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-database
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: kixiebrihspekbgnkzdn
      # Session pooler (IPv4, port 5432). Not secret; the password is.
      SUPABASE_POOLER_HOST: aws-0-us-east-2.pooler.supabase.com
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning title=Cloud database::SUPABASE_DB_PASSWORD secret is not set; skipping."
            exit 0
          fi
          # Percent-encode the password so any special characters survive in the URL.
          encoded=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$encoded"
          db_url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded}@${SUPABASE_POOLER_HOST}:5432/postgres"
          echo "::add-mask::$db_url"
          scripts/ci-run.sh "Migrations to apply" supabase migration list --db-url "$db_url"
          scripts/ci-run.sh "Supabase db push" supabase db push --yes --db-url "$db_url"
          scripts/ci-run.sh "Migrations applied" bash -c "supabase migration list --db-url \"\$0\" | tee /dev/stderr | grep -c '20261029' | xargs -I{} echo '::notice title=Cloud database::{} ShootFlow migrations present in the cloud database'" "$db_url"
